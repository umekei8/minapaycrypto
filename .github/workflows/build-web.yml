name: Build Web ZIP

on:
  push:
    branches: [ main, master ]
    paths:
      - 'web/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deploy ZIP (web/public contents only)
        run: |
          mkdir -p artifacts
          cd web/public
          zip -r ../../artifacts/minapaycrypto-web.zip . -x "*.DS_Store" -x "__MACOSX/*"
          ls -lh ../../artifacts/

      - name: Upload web ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: minapaycrypto-web
          path: artifacts/minapaycrypto-web.zip
          retention-days: 30
