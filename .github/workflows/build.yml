name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Get version name
        id: version
        run: |
          VERSION=$(./gradlew -q printVersionName 2>/dev/null || grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/' || echo "debug")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Create ZIP archive
        run: |
          cd artifacts
          zip minapaycrypto-debug.zip *.apk
          ls -lh

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: minapaycrypto-debug
          path: artifacts/minapaycrypto-debug.zip
          retention-days: 30

      - name: Upload raw APK
        uses: actions/upload-artifact@v4
        with:
          name: minapaycrypto-apk
          path: artifacts/*.apk
          retention-days: 30
